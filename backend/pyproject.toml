[project]
name = "backend"
version = "0.1.0"
description = "EMG Interview Project"
authors = [{ name = "Caleb Zeeman", email = "caleb@siliasstudios.com" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
 "httpx2>=2.13.1",
 "mypy>=2.4.0",
 "pytest>=9.1.1",
 "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs
    "UP",   # pyupgrade: modern syntax for the target Python
    "SIM",  # simplifications
    "C4",   # comprehensions
    "DTZ",  # naive datetime usage - all timestamps must be timezone-aware
    "FAST", # FastAPI-specific checks (e.g. Annotated dependencies)
    "PT",   # pytest style
    "RUF",  # ruff-specific checks
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "migrations", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
